<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <!-- iPhone対応 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>四国八十八ヶ所</title>

    <!-- LeafletのCSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <!-- 自分のCSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>四国八十八ヶ所</h1>
    </header>

    <!-- 地図 -->
    <div id="map"></div>

    <!-- ========================================
         札所詳細画面
         ======================================== -->

    <div id="temple-detail" class="hidden">

        <!-- 詳細画面ヘッダー -->
        <div class="detail-header">

            <h2 id="detail-title"></h2>

            <button id="detail-close">
                ×
            </button>

        </div>

        <!-- 詳細画面の内容 -->
        <div class="detail-content">

            <!-- 住所 -->
            <p id="detail-address"></p>


            <!-- ========================================
                 写真
                 ======================================== -->

            <div class="photo-area">

                <h3>📷 写真</h3>

                <!-- Firebaseから取得した写真を表示する場所 -->
                <div id="temple-photos"></div>

                <!-- 実際のファイル選択欄 -->
                <input
                    type="file"
                    id="photo-input"
                    accept="image/*"
                    hidden
                >

                <!-- ユーザーが押すボタン -->
                <button id="photo-add-button">
                    📷 写真を追加
                </button>

                <!-- アップロード状態 -->
                <p id="photo-status"></p>

            </div>


            <!-- ========================================
                 訪問状態
                 ======================================== -->

            <div id="detail-status"></div>


            <!-- ========================================
                 訪問日
                 ======================================== -->

            <div class="visit-date-area">

                <label for="visit-date">
                    訪問日
                </label>

                <input
                    type="date"
                    id="visit-date"
                >

            </div>


            <!-- 訪問済みボタン -->
            <button id="detail-visit-button"></button>

        </div>

    </div>


    <!-- ========================================
         Leaflet
         ======================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- ========================================
         自分のJavaScript
         ======================================== -->

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>


    <script
        type="module"
        src="app.js">
    </script>

    <!-- 写真拡大表示 -->
    <div id="photo-viewer" class="hidden">
        <img
            id="photo-viewer-image"
            src=""
        >
    </div>
</body>
</html>
